<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>
    <title>Watch or Watched overview</title>
  </head>
  <body>
    <header><p>Currently Watching vs Watched lists</p></header>
    <main class="mainCont">
      <!-- Div for input of shows -->
      <form action="submit" id="showInput">
        <!-- input for the name of the show -->
        <label for="seriesName">
          <input
            type="text"
            name="showName"
            id="showName"
            placeholder="What's the name of the show?"
          />
        </label>

        <!-- input for an image to display with sheris/show -->
        <label for="seriesImg"
          ><input
            type="text"
            name="showImg"
            id="showImg"
            placeholder="Image url here"
          />
        </label>

        <button id="submit" class="addShow">Add to Watchlist</button>
        <!-- Button for adsing show to "Want to watch list"/planner -->
      </form>
      <!-- If time: Adding another form attach to a different type of cards => The To wathc list -->
      <!-- <form action=""></form> -->
      <!-- div to display the js created watchCard -->
      <div class="watchingCardCont"></div>
      <!-- Create each of the elements, fetching the info from input, in js to push/append them here -->
      <!-- div to place Watched shows in -->
    </main>
    <footer></footer>
  </body>
</html>
