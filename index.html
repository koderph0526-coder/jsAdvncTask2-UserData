<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/main.js" defer></script>
    <title>Watch or Watched overview</title>
  </head>
  <body>
    <header><p>Currently Watching vs Watched lists</p></header>
    <main class="mainCont">
      <!-- Div for input of shows -->
      <form action="submit" id="showInput">
        <!-- input for the name of the show -->
        <label for="seriesName">
          Series/show name
          <input
            type="text"
            name="showName"
            id="showName"
            placeholder="What's the name of the show?"
          />
        </label>

        <!-- input for an image to display with sheris/show -->
        <label for="seriesImg">
          Image
          <input
            type="text"
            name="showImg"
            id="showImg"
            placeholder="Image url here"
          />
        </label>

        <!-- input for number of episodes -->
        <label for="seriesEps">
          Episodes
          <input type="text" id="showEp" placeholder="How many episodes?" />
        </label>

        <!-- letting a user create a named list/container for the shows -->
        <!-- <label for="listName" id="nameOfList">
          <input
            type="text"
            name="showsList"
            id="showsList"
            placeholder="..name of list/watching with?"
          />
        </label> -->

        <button id="submit" class="addShow">Add to Watchlist</button>
        <!-- Button for adsing show to "Want to watch list"/planner -->
      </form>
      <!-- Creating a sorting option instead, to focus on finishing the task on time and returning to my idea later -->
      <select name="selection" id="selection">
        <!-- <option value="1">Dato/Tid</option> -->
        <option value="1" id="sortByEp">Episodes</option>
        <option value="2" id="sortByName">Alfabetisk</option>
        <!-- <option value="3"></option> -->
      </select>
      <!-- If time: Adding another form attach to a different type of cards => The To wathc list -->
      <!-- <form action=""></form> -->
      <!-- div to display the js created watchCard -->
      <div class="watchingCardCont"></div>
      <!-- Create each of the elements, fetching the info from input, in js to push/append them here -->
      <!-- div to place Watched shows in -->
    </main>
    <footer></footer>
  </body>
</html>
